name: Update Quote

on:
  workflow_dispatch:        # run it manually from the Actions tab
  schedule:
    - cron: '0 10 * * *'    # 10:00 UTC = 12:00 noon South African time (SAST, UTC+2)

permissions:
  contents: write           # lets the workflow commit the updated README

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update quote
        run: node update-quote.js

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --staged --quiet || git commit -m 'Update README with daily quote'
          git push